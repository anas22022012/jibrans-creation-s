<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jibran's Creations — Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f7f4fb;
  color:#29243b
}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px #0001
}
.login{
  max-width:430px;
  margin:60px auto
}
h1,h2{margin-top:0}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:6px 0 12px;
  font-size:15px
}
textarea{min-height:90px;resize:vertical}
label{font-weight:700;font-size:14px}
button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700
}
.primary{background:#29243b;color:#fff}
.green{background:#4f9b76;color:#fff}
.red{background:#d9534f;color:#fff}
.blue{background:#587bdc;color:#fff}

.dashboard{display:none}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}
.stat{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 8px 20px #0001
}
.stat b{
  display:block;
  font-size:27px;
  margin-top:5px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px
}

.photo-upload{
  border:2px dashed #c9bde5;
  background:#faf8ff;
  padding:15px;
  border-radius:15px;
  text-align:center;
  margin-bottom:15px
}

.preview{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:15px;
  margin:10px auto;
  display:none;
  border:1px solid #ddd
}

.product{
  display:flex;
  gap:12px;
  align-items:center;
  border:1px solid #eee;
  border-radius:14px;
  padding:12px;
  margin-top:10px
}

.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:12px;
  background:#eee
}

.product-info{flex:1}
.product-info h3{margin:0 0 4px}
.product-info p{
  margin:3px 0;
  color:#666;
  font-size:13px
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.msg{
  margin-top:10px;
  font-weight:700
}

.coupon{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  margin-top:8px
}

.order{
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  margin-top:8px
}

.empty{
  color:#888;
  text-align:center;
  padding:15px
}

@media(max-width:750px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .top{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="card login" id="loginBox">

  <h1>🔐 Jibran's Creations</h1>
  <p>Private Admin Panel</p>

  <label>Admin Email</label>
  <input
    type="email"
    id="email"
    placeholder="Admin email"
  >

  <label>Password</label>
  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button
    class="primary"
    style="width:100%"
    onclick="login()"
  >
    🔐 Login
  </button>

  <div id="loginMsg" class="msg"></div>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="dashboard" id="dashboard">

<div class="wrap">

  <div class="card top">

    <div>
      <h1>🛍️ Jibran's Creations Admin</h1>
      <p>Manage your products, photos, coupons and orders.</p>
    </div>

    <button class="red" onclick="logout()">
      Logout
    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      📦 Products
      <b id="productCount">0</b>
    </div>

    <div class="stat">
      🎟️ Coupons
      <b id="couponCount">0</b>
    </div>

    <div class="stat">
      🛒 Orders
      <b id="orderCount">0</b>
    </div>

  </div>


  <div class="grid">

    <!-- ================= PRODUCT FORM ================= -->

    <div class="card">

      <h2>📦 Product</h2>

      <input
        type="hidden"
        id="editId"
      >

      <label>Product Name</label>
      <input
        id="pName"
        placeholder="Product name"
      >

      <label>MRP</label>
      <input
        id="pMrp"
        type="number"
        placeholder="299"
      >

      <label>Selling Price</label>
      <input
        id="pPrice"
        type="number"
        placeholder="249"
      >

      <label>Stock</label>
      <input
        id="pStock"
        type="number"
        placeholder="20"
      >

      <label>Category</label>

      <select id="pCategory">

        <option>Painting</option>
        <option>DIY</option>
        <option>Craft</option>
        <option>Kids</option>
        <option>Art</option>
        <option>Other</option>

      </select>


      <!-- ================= PHOTO ================= -->

      <label>📷 Product Photo</label>

      <div class="photo-upload">

        <p>Choose product photo</p>

        <input
          type="file"
          id="pImage"
          accept="image/*"
        >

        <img
          id="preview"
          class="preview"
          alt="Product preview"
        >

        <small>
          JPG, PNG or WEBP • Max 3MB
        </small>

      </div>


      <label>Description</label>

      <textarea
        id="pDescription"
        placeholder="Product description"
      ></textarea>


      <button
        class="green"
        onclick="saveProduct()"
      >
        ➕ Save Product
      </button>

      <button
        onclick="clearForm()"
      >
        Clear
      </button>

      <div
        id="productMsg"
        class="msg"
      ></div>

    </div>


    <!-- ================= PRODUCT LIST ================= -->

    <div class="card">

      <h2>🛍️ Your Products</h2>

      <div id="productList"></div>

    </div>


    <!-- ================= COUPONS ================= -->

    <div class="card">

      <h2>🎟️ Coupons</h2>

      <input
        id="couponCode"
        placeholder="Example: WELCOME10"
      >

      <input
        id="couponDiscount"
        type="number"
        placeholder="Discount %"
      >

      <button
        class="green"
        onclick="addCoupon()"
      >
        Add Coupon
      </button>

      <div id="couponList"></div>

    </div>


    <!-- ================= ORDERS ================= -->

    <div class="card">

      <h2>🛒 Orders</h2>

      <div id="orderList"></div>

    </div>

  </div>

</div>

</div>


<script>

/* =========================================
   ADMIN LOGIN
========================================= */

const ADMIN_EMAIL =
"jibran.shahban@gmail.com";

const ADMIN_PASSWORD =
"AnasAdmin@2026";


function login(){

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const msg =
    document.getElementById("loginMsg");


  if(
    email === ADMIN_EMAIL &&
    password === ADMIN_PASSWORD
  ){

    sessionStorage.setItem(
      "jcAdminLoggedIn",
      "true"
    );

    showDashboard();

  }else{

    msg.style.color="#d9534f";

    msg.textContent =
      "❌ Wrong email or password";

  }

}


function logout(){

  sessionStorage.removeItem(
    "jcAdminLoggedIn"
  );

  location.reload();

}


function showDashboard(){

  document.getElementById(
    "loginBox"
  ).style.display="none";

  document.getElementById(
    "dashboard"
  ).style.display="block";

  loadAll();

}


/* =========================================
   STORAGE
========================================= */

const PRODUCT_KEY =
"jcProductsV1";

const COUPON_KEY =
"jcCouponsV1";

const ORDER_KEY =
"jcOrders";


function getProducts(){

  try{

    return JSON.parse(
      localStorage.getItem(PRODUCT_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}


function saveProducts(products){

  localStorage.setItem(
    PRODUCT_KEY,
    JSON.stringify(products)
  );

}


/* =========================================
   PHOTO UPLOAD
========================================= */

let selectedImage="";


document
.getElementById("pImage")
.addEventListener(
"change",
function(){

  const file =
    this.files[0];

  if(!file)return;


  if(!file.type.startsWith("image/")){

    alert(
      "Please choose an image."
    );

    this.value="";

    return;

  }


  if(file.size > 3*1024*1024){

    alert(
      "Photo must be below 3MB."
    );

    this.value="";

    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    selectedImage =
      e.target.result;

    const preview =
      document.getElementById(
        "preview"
      );

    preview.src =
      selectedImage;

    preview.style.display =
      "block";

  };


  reader.readAsDataURL(file);

});


/* =========================================
   SAVE PRODUCT
========================================= */

function saveProduct(){

  const name =
    document.getElementById(
      "pName"
    ).value.trim();

  const mrp =
    Number(
      document.getElementById(
        "pMrp"
      ).value
    );

  const price =
    Number(
      document.getElementById(
        "pPrice"
      ).value
    );

  const stock =
    Number(
      document.getElementById(
        "pStock"
      ).value
    );

  const category =
    document.getElementById(
      "pCategory"
    ).value;

  const description =
    document.getElementById(
      "pDescription"
    ).value.trim();

  const editId =
    document.getElementById(
      "editId"
    ).value;


  if(!name){

    alert(
      "Product name डालो."
    );

    return;

  }


  if(!price){

    alert(
      "Selling price डालो."
    );

    return;

  }


  let products =
    getProducts();


  /* EDIT */

  if(editId){

    const index =
      products.findIndex(
        p =>
        String(p.id) ===
        String(editId)
      );


    if(index !== -1){

      products[index] = {

        ...products[index],

        name:name,

        mrp:mrp,

        price:price,

        stock:stock,

        category:category,

        description:description,

        image:
          selectedImage ||
          products[index].image ||
          ""

      };

    }

  }


  /* NEW */

  else{

    products.unshift({

      id:Date.now(),

      name:name,

      mrp:mrp,

      price:price,

      stock:stock,

      category:category,

      description:description,

      image:
        selectedImage || ""

    });

  }


  try{

    saveProducts(products);

  }catch(error){

    alert(
      "Storage full. छोटी photo use करो."
    );

    return;

  }


  document.getElementById(
    "productMsg"
  ).style.color="#4f9b76";

  document.getElementById(
    "productMsg"
  ).textContent =
    editId
    ? "✅ Product updated!"
    : "✅ Product added!";


  clearForm();

  renderProducts();

  updateStats();

}


/* =========================================
   CLEAR
========================================= */

function clearForm(){

  document.getElementById(
    "editId"
  ).value="";

  document.getElementById(
    "pName"
  ).value="";

  document.getElementById(
    "pMrp"
  ).value="";

  document.getElementById(
    "pPrice"
  ).value="";

  document.getElementById(
    "pStock"
  ).value="";

  document.getElementById(
    "pCategory"
  ).value="Painting";

  document.getElementById(
    "pDescription"
  ).value="";

  document.getElementById(
    "pImage"
  ).value="";

  selectedImage="";


  const preview =
    document.getElementById(
      "preview"
    );

  preview.src="";

  preview.style.display="none";

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

  const box =
    document.getElementById(
      "productList"
    );

  const products =
    getProducts();


  if(!products.length){

    box.innerHTML =
      '<div class="empty">No products yet.</div>';

    return;

  }


  box.innerHTML =
    products.map(
      p => `

      <div class="product">

        <img
          src="${p.image || ''}"
          alt=""
        >

        <div class="product-info">

          <h3>
            ${safe(p.name)}
          </h3>

          <p>
            ₹${Number(p.price || 0)}
            ${
              p.mrp
              ? `<del>₹${Number(p.mrp)}</del>`
              : ""
            }
          </p>

          <p>
            📦 Stock: ${Number(p.stock || 0)}
          </p>

          <p>
            🏷️ ${safe(
              p.category || "Other"
            )}
          </p>

        </div>

        <div class="actions">

          <button
            class="blue"
            onclick="editProduct('${p.id}')"
          >
            Edit
          </button>

          <button
            class="red"
            onclick="deleteProduct('${p.id}')"
          >
            Delete
          </button>

        </div>

      </div>

      `
    ).join("");

}


/* =========================================
   EDIT
========================================= */

function editProduct(id){

  const products =
    getProducts();

  const p =
    products.find(
      x =>
      String(x.id) ===
      String(id)
    );


  if(!p)return;


  document.getElementById(
    "editId"
  ).value=p.id;

  document.getElementById(
    "pName"
  ).value=p.name || "";

  document.getElementById(
    "pMrp"
  ).value=p.mrp || "";

  document.getElementById(
    "pPrice"
  ).value=p.price || "";

  document.getElementById(
    "pStock"
  ).value=p.stock || "";

  document.getElementById(
    "pCategory"
  ).value=p.category || "Other";

  document.getElementById(
    "pDescription"
  ).value=p.description || "";


  selectedImage =
    p.image || "";


  if(p.image){

    const preview =
      document.getElementById(
        "preview"
      );

    preview.src=p.image;

    preview.style.display="block";

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   DELETE
========================================= */

function deleteProduct(id){

  if(
    !confirm(
      "क्या इस product को delete करना है?"
    )
  )return;


  let products =
    getProducts();


  products =
    products.filter(
      p =>
      String(p.id) !==
      String(id)
    );


  saveProducts(products);

  renderProducts();

  updateStats();

}


/* =========================================
   COUPONS
========================================= */

function getCoupons(){

  try{

    return JSON.parse(
      localStorage.getItem(
        COUPON_KEY
      )
    ) || [];

  }catch(e){

    return [];

  }

}


function saveCoupons(c){

  localStorage.setItem(
    COUPON_KEY,
    JSON.stringify(c)
  );

}


function addCoupon(){

  const code =
    document.getElementById(
      "couponCode"
    ).value.trim().toUpperCase();

  const discount =
    Number(
      document.getElementById(
        "couponDiscount"
      ).value
    );


  if(!code || !discount){

    alert(
      "Coupon code और discount डालो."
    );

    return;

  }


  const coupons =
    getCoupons();


  coupons.push({

    id:Date.now(),

    code:code,

    discount:discount

  });


  saveCoupons(coupons);


  document.getElementById(
    "couponCode"
  ).value="";

  document.getElementById(
    "couponDiscount"
  ).value="";


  renderCoupons();

  updateStats();

}


function renderCoupons(){

  const box =
    document.getElementById(
      "couponList"
    );

  const coupons =
    getCoupons();


  if(!coupons.length){

    box.innerHTML =
      '<div class="empty">No coupons.</div>';

    return;

  }


  box.innerHTML =
    coupons.map(
      c => `

      <div class="coupon">

        <div>
          <b>${safe(c.code)}</b>
          <br>
          <small>
            ${Number(c.discount)}% OFF
          </small>
        </div>

        <button
          class="red"
          onclick="deleteCoupon('${c.id}')"
        >
          Delete
        </button>

      </div>

      `
    ).join("");

}


function deleteCoupon(id){

  let coupons =
    getCoupons();


  coupons =
    coupons.filter(
      c =>
      String(c.id) !==
      String(id)
    );


  saveCoupons(coupons);

  renderCoupons();

  updateStats();

}


/* =========================================
   ORDERS
========================================= */

function getOrders(){

  try{

    return JSON.parse(
      localStorage.getItem(
        ORDER_KEY
      )
    ) || [];

  }catch(e){

    return [];

  }

}


function renderOrders(){

  const box =
    document.getElementById(
      "orderList"
    );

  const orders =
    getOrders();


  if(!orders.length){

    box.innerHTML =
      '<div class="empty">No orders yet.</div>';

    return;

  }


  box.innerHTML =
    orders.map(
      (o,i) => `

      <div class="order">

        <b>Order #${i+1}</b>

        <p>
          ${safe(
            o.name ||
            o.customerName ||
            "Customer"
          )}
        </p>

        <p>
          ₹${Number(
            o.total ||
            o.amount ||
            0
          )}
        </p>

        <small>
          ${safe(
            o.status ||
            "Pending"
          )}
        </small>

      </div>

      `
    ).join("");

}


/* =========================================
   STATS
========================================= */

function updateStats(){

  document.getElementById(
    "productCount"
  ).textContent =
    getProducts().length;

  document.getElementById(
    "couponCount"
  ).textContent =
    getCoupons().length;

  document.getElementById(
    "orderCount"
  ).textContent =
    getOrders().length;

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   LOAD
========================================= */

function loadAll(){

  renderProducts();

  renderCoupons();

  renderOrders();

  updateStats();

}


/* =========================================
   AUTO LOGIN
========================================= */

if(
  sessionStorage.getItem(
    "jcAdminLoggedIn"
  ) === "true"
){

  showDashboard();

}

</script>

</body>
</html>
