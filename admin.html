<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jibran's Creations - Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      color: #333;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      color: #7c4dff;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
    }

    .login-btn {
      width: 100%;
      margin-top: 22px;
      background: #7c4dff;
      color: white;
      font-size: 16px;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 10px;
      background: #ffe5e5;
      color: #c62828;
      text-align: center;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
    }

    header {
      background: white;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #7c4dff;
    }

    .logout {
      background: #ffebee;
      color: #c62828;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .stat small {
      color: #777;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
      color: #7c4dff;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 22px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .card h2 {
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .primary {
      background: #7c4dff;
      color: white;
    }

    .danger {
      background: #ffebee;
      color: #c62828;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #faf7ff;
    }

    .product-row,
    .ticket-row {
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      header {
        padding: 14px;
      }

      .brand {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage" class="login-page">

  <div class="login-box">

    <div class="logo">Jibran's Creations</div>

    <div class="subtitle">
      Admin Panel
    </div>

    <form id="loginForm">

      <label>Email</label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Enter admin email"
        autocomplete="username"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="adminPassword"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button type="submit" class="login-btn">
        Login
      </button>

      <div id="loginError" class="error">
        Invalid email or password.
      </div>

    </form>

  </div>

</section>


<!-- ================= DASHBOARD ================= -->

<section id="dashboard">

  <header>

    <div class="brand">
      Jibran's Creations — Admin
    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </header>


  <main>

    <h1>Dashboard</h1>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <small>Products</small>
        <strong id="productCount">0</strong>
      </div>

      <div class="stat">
        <small>Orders</small>
        <strong id="orderCount">0</strong>
      </div>

      <div class="stat">
        <small>Open Tickets</small>
        <strong id="ticketCount">0</strong>
      </div>

      <div class="stat">
        <small>Coupons</small>
        <strong id="couponCount">0</strong>
      </div>

    </div>


    <!-- ADD PRODUCT -->

    <div class="card">

      <h2>Add Product</h2>

      <form id="productForm">

        <div class="grid">

          <div>
            <label>Product Name</label>
            <input id="productName" required>
          </div>

          <div>
            <label>Category</label>

            <select id="productCategory">

              <option value="DIY Kits">DIY Kits</option>
              <option value="Painting">Painting</option>
              <option value="Craft">Craft</option>
              <option value="Stationery">Stationery</option>
              <option value="Kids">Kids</option>
              <option value="Other">Other</option>

            </select>

          </div>

          <div>
            <label>MRP</label>
            <input id="productMRP" type="number" min="0" required>
          </div>

          <div>
            <label>Selling Price</label>
            <input id="productPrice" type="number" min="0" required>
          </div>

          <div>
            <label>Stock</label>
            <input id="productStock" type="number" min="0" required>
          </div>

          <div>
            <label>Product Photo</label>
            <input id="productImage" type="file" accept="image/*">
          </div>

        </div>

        <label>Description</label>

        <textarea id="productDescription"
          placeholder="Write product description..."></textarea>

        <br><br>

        <button class="primary" type="submit">
          Add Product
        </button>

      </form>

    </div>


    <!-- PRODUCTS -->

    <div class="card">

      <h2>Products</h2>

      <div id="productsList"></div>

    </div>


    <!-- ORDERS -->

    <div class="card">

      <h2>Orders</h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Total</th>
              <th>Status</th>
            </tr>

          </thead>

          <tbody id="ordersList"></tbody>

        </table>

      </div>

    </div>


    <!-- SUPPORT TICKETS -->

    <div class="card">

      <h2>Customer Support Tickets</h2>

      <div id="ticketsList"></div>

    </div>


    <!-- COUPONS -->

    <div class="card">

      <h2>Coupons</h2>

      <form id="couponForm">

        <div class="grid">

          <div>
            <label>Coupon Code</label>
            <input id="couponCode" required>
          </div>

          <div>
            <label>Discount %</label>
            <input id="couponDiscount" type="number" min="1" max="100" required>
          </div>

        </div>

        <br>

        <button class="primary">
          Add Coupon
        </button>

      </form>

      <br>

      <div id="couponsList"></div>

    </div>

  </main>

</section>


<script>

  /* ================= SETTINGS ================= */

  const ADMIN_EMAIL = "jibran.shahban@gmail.com";
  const ADMIN_PASSWORD = "AnasAdmin@2026";

  const PRODUCTS_KEY = "jcProductsV1";
  const ORDERS_KEY = "jcOrders";
  const TICKETS_KEY = "jcSupportTickets";
  const COUPONS_KEY = "jcCouponsV1";
  const SESSION_KEY = "jcAdminLoggedIn";


  /* ================= HELPERS ================= */

  function getData(key) {

    try {

      return JSON.parse(localStorage.getItem(key)) || [];

    } catch (error) {

      return [];

    }

  }


  function saveData(key, data) {

    localStorage.setItem(key, JSON.stringify(data));

  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ================= LOGIN ================= */

  const loginPage = document.getElementById("loginPage");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");


  function showDashboard() {

    loginPage.style.display = "none";
    dashboard.style.display = "block";

    loadDashboard();

  }


  function showLogin() {

    loginPage.style.display = "flex";
    dashboard.style.display = "none";

  }


  loginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document
      .getElementById("adminEmail")
      .value
      .trim()
      .toLowerCase();

    const password = document
      .getElementById("adminPassword")
      .value;

    if (
      email === ADMIN_EMAIL.toLowerCase() &&
      password === ADMIN_PASSWORD
    ) {

      localStorage.setItem(SESSION_KEY, "true");

      loginError.style.display = "none";

      showDashboard();

    } else {

      loginError.style.display = "block";

    }

  });


  /* ================= LOGOUT ================= */

  document
    .getElementById("logoutBtn")
    .addEventListener("click", function() {

      localStorage.removeItem(SESSION_KEY);

      showLogin();

    });


  /* ================= PRODUCTS ================= */

  function loadProducts() {

    const products = getData(PRODUCTS_KEY);

    const list = document.getElementById("productsList");

    document.getElementById("productCount").textContent =
      products.length;


    if (!products.length) {

      list.innerHTML =
        "<p>No products added yet.</p>";

      return;

    }


    list.innerHTML = products.map(function(product, index) {

      return `

        <div class="product-row">

          <strong>
            ${escapeHTML(product.name || "Unnamed Product")}
          </strong>

          <p>
            Category:
            ${escapeHTML(product.category || "Other")}
          </p>

          <p>
            Price:
            ₹${Number(product.price || 0)}
          </p>

          <p>
            Stock:
            ${Number(product.stock || 0)}
          </p>

          <br>

          <button
            class="danger"
            onclick="deleteProduct(${index})">
            Delete
          </button>

        </div>

      `;

    }).join("");

  }


  window.deleteProduct = function(index) {

    if (!confirm("Delete this product?")) return;

    const products = getData(PRODUCTS_KEY);

    products.splice(index, 1);

    saveData(PRODUCTS_KEY, products);

    loadDashboard();

  };


  document
    .getElementById("productForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const file =
        document.getElementById("productImage").files[0];

      function saveProduct(image) {

        const products = getData(PRODUCTS_KEY);

        products.push({

          id: "P" + Date.now(),

          name:
            document.getElementById("productName").value.trim(),

          category:
            document.getElementById("productCategory").value,

          mrp:
            Number(document.getElementById("productMRP").value),

          price:
            Number(document.getElementById("productPrice").value),

          stock:
            Number(document.getElementById("productStock").value),

          description:
            document.getElementById("productDescription").value.trim(),

          image: image || "",

          createdAt:
            new Date().toISOString()

        });

        saveData(PRODUCTS_KEY, products);

        this.reset();

        loadDashboard();

        alert("Product added successfully!");

      }


      if (!file) {

        saveProduct("");

        return;

      }


      if (file.size > 3 * 1024 * 1024) {

        alert("Image must be smaller than 3 MB.");

        return;

      }


      const reader = new FileReader();

      reader.onload = function() {

        saveProduct(reader.result);

      };

      reader.readAsDataURL(file);

    });


  /* ================= ORDERS ================= */

  function loadOrders() {

    const orders = getData(ORDERS_KEY);

    document.getElementById("orderCount").textContent =
      orders.length;

    const tbody =
      document.getElementById("ordersList");


    if (!orders.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="5">No orders yet.</td>
        </tr>
      `;

      return;

    }


    tbody.innerHTML = orders.map(function(order) {

      return `

        <tr>

          <td>
            ${escapeHTML(order.id || "N/A")}
          </td>

          <td>
            ${escapeHTML(
              order.customerName ||
              order.name ||
              "Customer"
            )}
          </td>

          <td>
            ${escapeHTML(
              order.phone ||
              order.customerPhone ||
              ""
            )}
          </td>

          <td>
            ₹${Number(
              order.total ||
              order.amount ||
              0
            )}
          </td>

          <td>

            <select
              onchange="updateOrderStatus('${escapeHTML(order.id)}', this.value)">

              <option
                ${order.status === "Pending" ? "selected" : ""}>
                Pending
              </option>

              <option
                ${order.status === "Confirmed" ? "selected" : ""}>
                Confirmed
              </option>

              <option
                ${order.status === "Shipped" ? "selected" : ""}>
                Shipped
              </option>

              <option
                ${order.status === "Delivered" ? "selected" : ""}>
                Delivered
              </option>

              <option
                ${order.status === "Cancelled" ? "selected" : ""}>
                Cancelled
              </option>

            </select>

          </td>

        </tr>

      `;

    }).join("");

  }


  window.updateOrderStatus = function(id, status) {

    const orders = getData(ORDERS_KEY);

    const order = orders.find(function(item) {

      return String(item.id) === String(id);

    });


    if (order) {

      order.status = status;

      saveData(ORDERS_KEY, orders);

      loadOrders();

    }

  };


  /* ================= TICKETS ================= */

  function loadTickets() {

    const tickets = getData(TICKETS_KEY);

    const openTickets =
      tickets.filter(function(ticket) {

        return ticket.status !== "Resolved";

      });


    document.getElementById("ticketCount").textContent =
      openTickets.length;


    const list =
      document.getElementById("ticketsList");


    if (!tickets.length) {

      list.innerHTML =
        "<p>No support tickets.</p>";

      return;

    }


    list.innerHTML = tickets.map(function(ticket, index) {

      return `

        <div class="ticket-row">

          <strong>
            Ticket:
            ${escapeHTML(ticket.id || ("T" + index))}
          </strong>

          <p>
            Customer:
            ${escapeHTML(ticket.name || "Customer")}
          </p>

          <p>
            Phone:
            ${escapeHTML(ticket.phone || "")}
          </p>

          <p>
            Problem:
            ${escapeHTML(ticket.type || ticket.problem || "")}
          </p>

          <p>
            Message:
            ${escapeHTML(ticket.message || "")}
          </p>

          <p>
            Status:
            ${escapeHTML(ticket.status || "Open")}
          </p>

          <br>

          ${
            ticket.status !== "Resolved"
            ? `
              <button
                class="success"
                onclick="resolveTicket(${index})">
                Mark Resolved
              </button>
            `
            : ""
          }

          <button
            class="danger"
            onclick="deleteTicket(${index})">
            Delete
          </button>

        </div>

      `;

    }).join("");

  }


  window.resolveTicket = function(index) {

    const tickets = getData(TICKETS_KEY);

    if (tickets[index]) {

      tickets[index].status = "Resolved";

      saveData(TICKETS_KEY, tickets);

      loadDashboard();

    }

  };


  window.deleteTicket = function(index) {

    if (!confirm("Delete this ticket?")) return;

    const tickets = getData(TICKETS_KEY);

    tickets.splice(index, 1);

    saveData(TICKETS_KEY, tickets);

    loadDashboard();

  };


  /* ================= COUPONS ================= */

  function loadCoupons() {

    const coupons = getData(COUPONS_KEY);

    document.getElementById("couponCount").textContent =
      coupons.length;

    const list =
      document.getElementById("couponsList");


    if (!coupons.length) {

      list.innerHTML =
        "<p>No coupons yet.</p>";

      return;

    }


    list.innerHTML = coupons.map(function(coupon, index) {

      return `

        <div class="product-row">

          <strong>
            ${escapeHTML(coupon.code)}
          </strong>

          <p>
            Discount:
            ${Number(coupon.discount)}%
          </p>

          <br>

          <button
            class="danger"
            onclick="deleteCoupon(${index})">
            Delete
          </button>

        </div>

      `;

    }).join("");

  }


  document
    .getElementById("couponForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const coupons = getData(COUPONS_KEY);

      coupons.push({

        code:
          document
            .getElementById("couponCode")
            .value
            .trim()
            .toUpperCase(),

        discount:
          Number(
            document
              .getElementById("couponDiscount")
              .value
          )

      });

      saveData(COUPONS_KEY, coupons);

      this.reset();

      loadDashboard();

      alert("Coupon added!");

    });


  window.deleteCoupon = function(index) {

    if (!confirm("Delete this coupon?")) return;

    const coupons = getData(COUPONS_KEY);

    coupons.splice(index, 1);

    saveData(COUPONS_KEY, coupons);

    loadDashboard();

  };


  /* ================= DASHBOARD ================= */

  function loadDashboard() {

    loadProducts();
    loadOrders();
    loadTickets();
    loadC
