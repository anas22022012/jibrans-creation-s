<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Jibran's Creations — Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f7f4fb;
  color:#333;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#fbdcec,#e8ddff,#d9f5ff);
}

.loginBox{
  width:min(420px,100%);
  background:white;
  padding:30px;
  border-radius:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.15);
}

.logo{
  text-align:center;
  font-size:27px;
  font-weight:bold;
  color:#8745ae;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.formGroup{
  margin-bottom:15px;
}

.formGroup label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

.formGroup textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  padding:13px;
  background:#8f4db8;
  color:white;
  border-radius:12px;
  font-weight:bold;
}

.error{
  color:#d33;
  text-align:center;
  margin-top:12px;
}

#dashboard{
  display:none;
}

header{
  background:white;
  padding:15px 4%;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.headerInner{
  max-width:1400px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand{
  color:#8745ae;
  font-weight:bold;
  font-size:22px;
}

.logout{
  padding:10px 18px;
  border-radius:10px;
  background:#eee;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat h3{
  color:#777;
  font-size:14px;
}

.stat strong{
  display:block;
  font-size:28px;
  color:#8745ae;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  margin-bottom:20px;
}

.card h2{
  color:#6d3d89;
  margin-bottom:18px;
}

.products{
  display:grid;
  gap:12px;
}

.product{
  border:1px solid #eee;
  padding:15px;
  border-radius:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:80px;
  height:80px;
  border-radius:12px;
  object-fit:cover;
  background:#f2f2f2;
}

.productInfo{
  flex:1;
}

.productInfo h3{
  margin-bottom:5px;
}

.productInfo p{
  color:#777;
  font-size:13px;
  margin:3px 0;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}

.edit{
  background:#e7ddff;
  padding:8px 12px;
  border-radius:8px;
}

.delete{
  background:#ffe0e0;
  padding:8px 12px;
  border-radius:8px;
}

.cancel{
  background:#eee;
  padding:12px;
  border-radius:10px;
  margin-top:8px;
  width:100%;
}

.photoPreview{
  width:100%;
  height:160px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:12px;
  display:none;
  margin-top:10px;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top;
}

th{
  background:#faf7fc;
}

.ticket{
  border:1px solid #eee;
  border-radius:15px;
  padding:16px;
  margin-bottom:12px;
}

.ticketTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.ticketId{
  color:#8145a6;
  font-weight:bold;
}

.status{
  padding:5px 10px;
  border-radius:20px;
  background:#fff0c8;
  font-size:12px;
}

.ticketMessage{
  background:#fafafa;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}

.smallBtn{
  padding:8px 12px;
  border-radius:8px;
  background:#eee;
}

.openBtn{
  background:#e4f8e9;
}

.resolvedBtn{
  background:#dff1ff;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#30213b;
  color:white;
  padding:13px 20px;
  border-radius:30px;
  opacity:0;
  transition:.3s;
  z-index:9999;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .container{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:65px;
    height:65px;
  }

  .headerInner{
    flex-wrap:wrap;
  }

  .brand{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen" class="login">

  <div class="loginBox">

    <div class="logo">
      Jibran's Creations
    </div>

    <div class="subtitle">
      Admin Panel
    </div>

    <div class="formGroup">

      <label>Email</label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Admin email">

    </div>

    <div class="formGroup">

      <label>Password</label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Password">

    </div>

    <button
      class="primary"
      onclick="login()">

      Login

    </button>

    <div
      id="loginError"
      class="error">
    </div>

  </div>

</section>


<!-- =========================
     DASHBOARD
========================= -->

<section id="dashboard">

<header>

  <div class="headerInner">

    <div class="brand">
      Jibran's Creations — Admin
    </div>

    <button
      class="logout"
      onclick="logout()">

      Logout

    </button>

  </div>

</header>


<main class="container">

  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <h3>Products</h3>

      <strong id="statProducts">
        0
      </strong>

    </div>

    <div class="stat">

      <h3>Orders</h3>

      <strong id="statOrders">
        0
      </strong>

    </div>

    <div class="stat">

      <h3>Open Tickets</h3>

      <strong id="statTickets">
        0
      </strong>

    </div>

    <div class="stat">

      <h3>Coupons</h3>

      <strong id="statCoupons">
        0
      </strong>

    </div>

  </div>


  <div class="grid">

    <!-- =====================
         PRODUCT FORM
    ====================== -->

    <div>

      <div class="card">

        <h2 id="formTitle">
          Add Product
        </h2>

        <input
          type="hidden"
          id="productId">

        <div class="formGroup">

          <label>
            Product Name
          </label>

          <input
            id="productName"
            placeholder="Product name">

        </div>


        <div class="formGroup">

          <label>
            MRP
          </label>

          <input
            id="productMRP"
            type="number"
            placeholder="149">

        </div>


        <div class="formGroup">

          <label>
            Selling Price
          </label>

          <input
            id="productPrice"
            type="number"
            placeholder="99">

        </div>


        <div class="formGroup">

          <label>
            Stock
          </label>

          <input
            id="productStock"
            type="number"
            placeholder="20">

        </div>


        <div class="formGroup">

          <label>
            Category
          </label>

          <select id="productCategory">

            <option>
              DIY
            </option>

            <option>
              Painting
            </option>

            <option>
              Craft
            </option>

            <option>
              Kids
            </option>

            <option>
              Gift
            </option>

          </select>

        </div>


        <div class="formGroup">

          <label>
            Product Photo
          </label>

          <input
            id="productPhoto"
            type="file"
            accept="image/*"
            onchange="previewPhoto(event)">

          <img
            id="photoPreview"
            class="photoPreview">

        </div>


        <div class="formGroup">

          <label>
            Description
          </label>

          <textarea
            id="productDescription"
            placeholder="Product description"></textarea>

        </div>


        <button
          class="primary"
          onclick="saveProduct()">

          Save Product

        </button>


        <button
          id="cancelEdit"
          class="cancel"
          style="display:none"
          onclick="cancelEdit()">

          Cancel Edit

        </button>

      </div>


      <!-- COUPONS -->

      <div class="card">

        <h2>
          Coupons
        </h2>

        <div class="formGroup">

          <label>
            Coupon Code
          </label>

          <input
            id="couponCode"
            placeholder="SAVE10">

        </div>


        <div class="formGroup">

          <label>
            Discount %
          </label>

          <input
            id="couponDiscount"
            type="number"
            placeholder="10">

        </div>


        <button
          class="primary"
          onclick="addCoupon()">

          Add Coupon

        </button>

        <div
          id="couponList"
          style="margin-top:15px">
        </div>

      </div>

    </div>


    <!-- =====================
         RIGHT SIDE
    ====================== -->

    <div>

      <!-- PRODUCTS -->

      <div class="card">

        <h2>
          Products
        </h2>

        <div
          id="productList"
          class="products">
        </div>

      </div>


      <!-- ORDERS -->

      <div class="card">

        <h2>
          Orders
        </h2>

        <div
          id="orderList">
        </div>

      </div>


      <!-- SUPPORT TICKETS -->

      <div class="card">

        <h2>
          🎫 Customer Support Tickets
        </h2>

        <div
          id="ticketList">
        </div>

      </div>

    </div>

  </div>

</main>

</section>


<div id="toast" class="toast"></div>


<script>

/* ==========================================
   KEYS
========================================== */

const PRODUCT_KEY =
  "jcProductsV1";

const COUPON_KEY =
  "jcCouponsV1";

const ORDER_KEY =
  "jcOrders";

const TICKET_KEY =
  "jcSupportTickets";

const LOGIN_KEY =
  "jcAdminLoggedIn";


/* ==========================================
   ADMIN LOGIN
========================================== */

const ADMIN_EMAIL =
  "jibran.shahban@gmail.com";

const ADMIN_PASSWORD =
  "AnasAdmin@2026";


function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(
    email === ADMIN_EMAIL &&
    password === ADMIN_PASSWORD
  ){

    sessionStorage.setItem(
      LOGIN_KEY,
      "true"
    );

    showDashboard();

  }else{

    document
      .getElementById("loginError")
      .textContent =
      "Invalid email or password.";

  }

}


function logout(){

  sessionStorage.removeItem(
    LOGIN_KEY
  );

  location.reload();

}


function showDashboard(){

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("dashboard")
    .style.display = "block";

  refreshAll();

}


/* ==========================================
   STORAGE
========================================== */

function getJSON(key,fallback){

  try{

    const value =
      localStorage.getItem(key);

    return value
      ? JSON.parse(value)
      : fallback;

  }catch(e){

    return fallback;

  }

}


function setJSON(key,value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


/* ==========================================
   PRODUCTS
========================================== */

function getProducts(){

  return getJSON(
    PRODUCT_KEY,
    []
  );

}


function saveProduct(){

  const id =
    document
      .getElementById("productId")
      .value;

  const name =
    document
      .getElementById("productName")
      .value
      .trim();

  const mrp =
    Number(
      document
        .getElementById("productMRP")
        .value
    );

  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );

  const stock =
    Number(
      document
        .getElementById("productStock")
        .value
    );

  const category =
    document
      .getElementById("productCategory")
      .value;

  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();

  const photoInput =
    document
      .getElementById("productPhoto");


  if(
    !name ||
    !mrp ||
    !price ||
    stock < 0
  ){

    showToast(
      "Please fill product details."
    );

    return;

  }


  const products =
    getProducts();


  const finishSave =
    function(image){

      let product;


      if(id){

        const index =
          products.findIndex(
            p => p.id === id
          );


        if(index === -1){

          showToast(
            "Product not found."
          );

          return;

        }


        product = {

          ...products[index],

          name:name,
          mrp:mrp,
          price:price,
          stock:stock,
          category:category,
          description:description

        };


        if(image){

          product.image =
            image;

        }


        products[index] =
          product;


        showToast(
          "Product updated successfully."
        );


      }else{

        product = {

          id:
            "p" +
            Date.now(),

          name:name,

          mrp:mrp,

          price:price,

          stock:stock,

          category:category,

          image:image || "",

          description:description

        };


        products.unshift(product);


        showToast(
          "Product added successfully."
        );

      }


      setJSON(
        PRODUCT_KEY,
        products
      );


      resetProductForm();

      refreshAll();

    };


  if(photoInput.files[0]){

    const file =
      photoInput.files[0];


    if(file.size > 3 * 1024 * 1024){

      showToast(
        "Photo must be below 3MB."
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(){

        finishSave(
          reader.result
        );

      };


    reader.readAsDataURL(file);

  }else{

    finishSave("");

  }

}


/* ==========================================
   PHOTO PREVIEW
========================================== */

function previewPhoto(event){

  const file =
    event.target.files[0];

  if(!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(){

      const img =
        document
          .getElementById("photoPreview");

      img.src =
        reader.result;

      img.style.display =
        "block";

    };


  reader.readAsDataURL(file);

}


/* ==========================================
   RENDER PRODUCTS
========================================== */

function renderProducts(){

  const products =
    getProducts();

  const box =
    document
      .getElementById("productList");


  if(!products.length){

    box.innerHTML = `
      <div class="empty">
        No products added yet.
      </div>
    `;

    return;

  }


  box.innerHTML =
    products.map(product => `

      <div class="product">

        <img
          src="${
            product.image ||
            "https://via.placeholder.com/100?text=Product"
          }"
          alt="Product">

        <div class="productInfo">

          <h3>
            ${escapeHTML(product.name)}
          </h3>

          <p>
            MRP:
            ₹${Number(product.mrp)}
          </p>

          <p>
            Selling:
            ₹${Number(product.price)}
          </p>

          <p>
            Stock:
            ${Number(product.stock)}
          </p>

          <p>
            Category:
            ${escapeHTML(product.category)}
          </p>

          <div class="actions">

            <button
              class="edit"
              onclick="editProduct('${product.id}')">

              Edit

            </button>

            <button
              class="delete"
              onclick="deleteProduct('${product.id}')">

              Delete

            </button>

          </div>

        </div>

      </div>

    `).join("");

}


function editProduct(id){

  const product =
    getProducts()
      .find(p => p.id === id);


  if(!product) return;


  document
    .getElementById("productId")
    .value = product.id;

  document
    .getElementById("productName")
    .value = product.name;

  document
    .getElementById("productMRP")
    .value = product.mrp;

  document
    .getElementById("productPrice")
    .value = product.price;

  document
    .getElementById("productStock")
    .value = product.stock;

  document
    .getElementById("productCategory")
    .value = product.category;

  document
    .getElementById("productDescription")
    .value =
      product.description || "";


  const preview =
    document
      .getElementById("photoPreview");


  if(product.image){

    preview.src =
      product.image;

    preview.style.display =
      "block";

  }else{

    preview.style.display =
      "none";

  }


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Product";

  document
    .getElementById("cancelEdit")
    .style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function cancelEdit(){

  resetProductForm();

}


function resetProductForm(){

  document
    .getElementById("productId")
    .value = "";

  document
    .getElementById("productName")
    .value = "";

  document
    .getElementById("productMRP")
    .value = "";

  document
    .getElementById("productPrice")
    .value = "";

  document
    .getElementById("productStock")
    .value = "";

  document
    .getElementById("productDescription")
    .value = "";

  document
    .getElementById("productPhoto")
    .value = "";

  document
    .getElementById("photoPreview")
    .style.display =
    "none";

  document
    .getElementById("formTitle")
    .textContent =
    "Add Product";

  document
    .getElementById("cancelEdit")
    .style.display =
    "none";

}


function deleteProduct(id){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

    return;

  }


  const products =
    getProducts()
      .filter(p => p.id !== id);


  setJSON(
    PRODUCT_KEY,
    products
  );


  showToast(
    "Product deleted."
  );


  refreshAll();

}


/* ==========================================
   COUPONS
========================================== */

function getCoupons(){

  return getJSON(
    COUPON_KEY,
    []
  );

}


function addCoupon(){

  const code =
    document
      .getElementById("couponCode")
      .value
      .trim()
      .toUpperCase();

  const discount =
    Number(
      document
        .getElementById("couponDiscount")
        .value
    );


  if(
    !code ||
    discount <= 0 ||
    discount > 100
  ){

    showToast(
      "Enter a valid coupon."
    );

    return;

  }


  const coupons =
    getCoupons();


  coupons.push({

    code:code,

    discount:discount

  });


  setJSON(
    COUPON_KEY,
    coupons
  );


  document
