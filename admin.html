<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jibran's Creations — Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f4fb;
  color:#29243b;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.login-box{
  max-width:430px;
  margin:60px auto;
  background:white;
  padding:28px;
  border-radius:24px;
  box-shadow:0 15px 45px #0002;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  margin:6px 0 14px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#9b7bea;
}

textarea{
  min-height:90px;
  resize:vertical;
}

label{
  font-weight:700;
  font-size:14px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  background:#29243b;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

.btn-pink{
  background:#d86ca5;
}

.btn-green{
  background:#4f9b76;
}

.btn-red{
  background:#d9534f;
}

.btn-blue{
  background:#587bdc;
}

.dashboard{
  display:none;
}

.header{
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 10px 30px #0001;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:5px 0 0;
  color:#777;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 8px 25px #0001;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:5px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 10px 30px #0001;
}

.card h2{
  margin-top:0;
}

.photo-box{
  border:2px dashed #cfc5e9;
  border-radius:15px;
  padding:15px;
  text-align:center;
  background:#faf8ff;
  margin-bottom:15px;
}

.photo-preview{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:15px;
  display:none;
  margin:10px auto;
  border:1px solid #ddd;
}

.product-list{
  display:grid;
  gap:12px;
  margin-top:15px;
}

.product{
  display:flex;
  gap:15px;
  align-items:center;
  padding:12px;
  border:1px solid #eee;
  border-radius:15px;
}

.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:12px;
  background:#f2f2f2;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:0 0 5px;
}

.product-info p{
  margin:3px 0;
  color:#666;
  font-size:14px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.small-btn{
  padding:8px 10px;
  border:0;
  border-radius:9px;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.coupon-row{
  display:flex;
  gap:8px;
}

.coupon-row input{
  margin:0;
}

.coupon{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid #eee;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}

.order{
  border:1px solid #eee;
  padding:14px;
  border-radius:14px;
  margin-top:10px;
}

.empty{
  color:#888;
  text-align:center;
  padding:20px;
}

.msg{
  text-align:center;
  margin-top:10px;
  font-weight:700;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:500px){
  .wrap{
    padding:12px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:60px;
    height:60px;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login-box" id="loginBox">

  <div class="logo">🛍️ Jibran's Creations</div>

  <div class="subtitle">
    🔐 Private Admin Panel
  </div>

  <label>Admin Email</label>
  <input
    type="email"
    id="loginEmail"
    placeholder="Enter admin email"
  >

  <label>Password</label>
  <input
    type="password"
    id="loginPassword"
    placeholder="Enter password"
  >

  <button class="btn" style="width:100%" onclick="login()">
    🔐 Secure Login
  </button>

  <div class="msg" id="loginMsg"></div>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="dashboard" id="dashboard">

<div class="wrap">

  <div class="header">

    <div>
      <h1>🔐 Jibran's Creations Admin</h1>
      <p>Manage products, coupons and orders</p>
    </div>

    <button class="btn btn-red" onclick="logout()">
      Logout
    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      📦 Products
      <strong id="productCount">0</strong>
    </div>

    <div class="stat">
      🎟️ Coupons
      <strong id="couponCount">0</strong>
    </div>

    <div class="stat">
      🛍️ Orders
      <strong id="orderCount">0</strong>
    </div>

    <div class="stat">
      ⭐ Status
      <strong>Active</strong>
    </div>

  </div>


  <div class="grid">


    <!-- ================= ADD PRODUCT ================= -->

    <div class="card">

      <h2>📦 Add / Edit Product</h2>

      <input type="hidden" id="editId">

      <label>Product Name</label>
      <input
        type="text"
        id="pName"
        placeholder="Example: DIY Painting Kit"
      >

      <label>MRP</label>
      <input
        type="number"
        id="pMrp"
        placeholder="Example: 299"
      >

      <label>Selling Price</label>
      <input
        type="number"
        id="pPrice"
        placeholder="Example: 249"
      >

      <label>Stock</label>
      <input
        type="number"
        id="pStock"
        placeholder="Example: 20"
      >

      <label>Category</label>
      <select id="pCategory">

        <option value="Painting">
          Painting
        </option>

        <option value="DIY">
          DIY
        </option>

        <option value="Craft">
          Craft
        </option>

        <option value="Kids">
          Kids
        </option>

        <option value="Art">
          Art
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <!-- ================= PHOTO UPLOAD ================= -->

      <label>📷 Product Photo</label>

      <div class="photo-box">

        <div>
          Choose product image
        </div>

        <input
          type="file"
          id="pImage"
          accept="image/*"
        >

        <img
          id="imagePreview"
          class="photo-preview"
          alt="Product Preview"
        >

        <div style="font-size:12px;color:#888">
          JPG / PNG / WEBP recommended
        </div>

      </div>


      <label>Description</label>

      <textarea
        id="pDescription"
        placeholder="Write product description..."
      ></textarea>


      <div style="display:flex;gap:10px;flex-wrap:wrap">

        <button
          class="btn btn-pink"
          onclick="saveProduct()"
        >
          ➕ Save Product
        </button>

        <button
          class="btn"
          onclick="clearProductForm()"
        >
          Clear
        </button>

      </div>

      <div
        class="msg"
        id="productMsg"
      ></div>

    </div>


    <!-- ================= PRODUCTS ================= -->

    <div class="card">

      <h2>🛍️ Products</h2>

      <div
        id="productList"
        class="product-list"
      ></div>

    </div>


    <!-- ================= COUPONS ================= -->

    <div class="card">

      <h2>🎟️ Coupons / Discounts</h2>

      <div class="coupon-row">

        <input
          type="text"
          id="couponCode"
          placeholder="Coupon code"
        >

        <input
          type="number"
          id="couponDiscount"
          placeholder="%"
          style="max-width:100px"
        >

        <button
          class="btn btn-green"
          onclick="addCoupon()"
        >
          Add
        </button>

      </div>

      <div id="couponList"></div>

    </div>


    <!-- ================= ORDERS ================= -->

    <div class="card">

      <h2>📋 Orders</h2>

      <div id="orderList"></div>

    </div>


  </div>

</div>

</div>


<script>

/* =====================================================
   ADMIN LOGIN
===================================================== */

const ADMIN_EMAIL = "jibran.shahban@gmail.com";

const ADMIN_PASSWORD = "AnasAdmin@2026";


function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const msg =
    document.getElementById("loginMsg");


  if(
    email === ADMIN_EMAIL &&
    password === ADMIN_PASSWORD
  ){

    sessionStorage.setItem(
      "jcAdminLoggedIn",
      "true"
    );

    showDashboard();

  }else{

    msg.textContent =
      "❌ Wrong email or password";

    msg.style.color = "#d9534f";

  }

}


function logout(){

  sessionStorage.removeItem(
    "jcAdminLoggedIn"
  );

  location.reload();

}


function showDashboard(){

  document.getElementById(
    "loginBox"
  ).style.display = "none";

  document.getElementById(
    "dashboard"
  ).style.display = "block";

  loadAll();

}


/* =====================================================
   PRODUCT DATA
===================================================== */

const PRODUCT_KEY = "jcProductsV1";

const COUPON_KEY = "jcCouponsV1";

const ORDER_KEY = "jcOrders";


function getProducts(){

  try{

    return JSON.parse(
      localStorage.getItem(PRODUCT_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}


function saveProducts(products){

  localStorage.setItem(
    PRODUCT_KEY,
    JSON.stringify(products)
  );

}


/* =====================================================
   IMAGE UPLOAD
===================================================== */

let selectedImage = "";


document
  .getElementById("pImage")
  .addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file){
      return;
    }


    if(!file.type.startsWith("image/")){

      alert("Please select an image file.");

      this.value = "";

      return;

    }


    /*
      Image size limit
    */

    if(file.size > 3 * 1024 * 1024){

      alert(
        "Image is too large. Please choose an image below 3MB."
      );

      this.value = "";

      return;

    }


    const reader = new FileReader();


    reader.onload = function(event){

      selectedImage =
        event.target.result;


      const preview =
        document.getElementById(
          "imagePreview"
        );

      preview.src =
        selectedImage;

      preview.style.display =
        "block";

    };


    reader.readAsDataURL(file);

  });


/* =====================================================
   SAVE PRODUCT
===================================================== */

function saveProduct(){

  const name =
    document.getElementById("pName")
    .value.trim();

  const mrp =
    Number(
      document.getElementById("pMrp")
      .value
    );

  const price =
    Number(
      document.getElementById("pPrice")
      .value
    );

  const stock =
    Number(
      document.getElementById("pStock")
      .value
    );

  const category =
    document.getElementById("pCategory")
    .value;

  const description =
    document.getElementById("pDescription")
    .value.trim();

  const editId =
    document.getElementById("editId")
    .value;


  if(!name){

    alert("Please enter product name.");

    return;

  }


  if(!price){

    alert("Please enter selling price.");

    return;

  }


  let products =
    getProducts();


  /*
    EDIT PRODUCT
  */

  if(editId){

    const index =
      products.findIndex(
        p => String(p.id) === String(editId)
      );


    if(index !== -1){

      products[index] = {

        ...products[index],

        name:name,

        mrp:mrp,

        price:price,

        stock:stock,

        category:category,

        description:description,

        image:
          selectedImage ||
          products[index].image ||
          ""

      };

    }

  }


  /*
    ADD NEW PRODUCT
  */

  else{

    const product = {

      id:
        Date.now(),

      name:name,

      mrp:mrp,

      price:price,

      stock:stock,

      category:category,

      description:description,

      image:
        selectedImage || ""

    };


    products.unshift(product);

  }


  try{

    saveProducts(products);

  }catch(e){

    alert(
      "Storage full. Please use a smaller product image."
    );

    return;

  }


  document.getElementById(
    "productMsg"
  ).textContent =
    editId
      ? "✅ Product updated successfully!"
      : "✅ Product added successfully!";


  document.getElementById(
    "productMsg"
  ).style.color =
    "#4f9b76";


  clearProductForm();

  renderProducts();

  updateStats();

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearProductForm(){

  document.getElementById(
    "editId"
  ).value = "";

  document.getElementById(
    "pName"
  ).value = "";

  document.getElementById(
    "pMrp"
  ).value = "";

  document.getElementById(
    "pPrice"
  ).value = "";

  document.getElementById(
    "pStock"
  ).value = "";

  document.getElementById(
    "pCategory"
  ).value = "Painting";

  document.getElementById(
    "pDescription"
  ).value = "";

  document.getElementById(
    "pImage"
  ).value = "";

  selectedImage = "";

  const preview =
    document.getElementById(
      "imagePreview"
    );

  preview.src = "";

  preview.style.display =
    "none";

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

  const box =
    document.getElementById(
      "productList"
    );

  const products =
    getProducts();


  if(!products.length){

    box.innerHTML =
      '<div class="empty">No products added yet.</div>';

    return;

  }


  box.innerHTML =
    products.map(p => `

      <div class="product">

        <img
          src="${p.image || ''}"
          onerror="this.style.visibility='hidden'"
          alt=""
        >

        <div class="product-info">

          <h3>
            ${escapeHtml(p.name)}
          </h3>

          <p>
            ₹${Number(p.price || 0)}
            ${p.mrp
              ? ` <del>₹${Number(p.mrp)}</del>`
              : ""
            }
          </p>

          <p>
            📦 Stock: ${Number(p.stock || 0)}
          </p>

          <p>
            🏷️ ${escapeHtml(p.category || "Other")}
          </p>

        </div>

        <div class="actions">

          <button
            class="small-btn btn-blue"
            onclick="editProduct('${p.id}')"
          >
            Edit
          </button>

          <button
            class="small-btn btn-red"
            onclick="deleteProduct('${p.id}')"
          >
            Delete
          </button>

        </div>

      </div>

    `).join("");

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

  const products =
    getProducts();

  const product =
    products.find(
      p => String(p.id) === String(id)
    );


  if(!product){
    return;
  }


  document.getElementById(
    "editId"
  ).value =
    product.id;

  document.getElementById(
    "pName"
  ).value =
    product.name || "";

  document.getElementById(
    "pMrp"
  ).value =
    product.mrp || "";

  document.getElementById(
    "pPrice"
  ).value =
    product.price || "";

  document.getElementById(
    "pStock"
  ).value =
    product.stock || "";

  document.getElementById(
    "pCategory"
  ).value =
    product.category || "Other";

  document.getElementById(
    "pDescription"
  ).value =
    product.description || "";


  selectedImage =
    product.image || "";


  const preview =
    document.getElementById(
      "imagePreview"
    );


  if(selectedImage){

    preview.src =
      selectedImage;

    preview.style.display =
      "block";

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

function deleteProduct(id){

  if(
    !confirm(
      "Delete this product?"
    )
  ){
    return;
  }


  let products =
    getProducts();


  products =
    products.filter(
      p =>
        String(p.id) !== String(id)
    );


  saveProducts(products);

  renderProducts();

  updateStats();

}


/* =====================================================
   COUPONS
===================================================== */

function getCoupons(){

  try{

    return JSON.parse(
      localStorage.getItem(COUPON_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}


function saveCoupons(coupons){

  localStorage.setItem(
    COUPON_KEY,
    JSON.stringify(coupons)
  );

}


function addCoupon(){

  const code =
    document.getElementById(
      "couponCode"
    ).value
    .trim()
    .toUpperCase();

  const discount =
    Number(
      document.getElementById(
        "couponDiscount"
      ).value
    );


  if(!code || !discount){

    alert(
      "Enter coupon code and discount."
    );

    return;

  }


  const coupons =
    getCoupons();


  coupons.push({

    id:Date.now(),

    code:code,

    discount:discount

  });


  saveCoupons(coupons);


  document.getElementById(
    "couponCode"
  ).value = "";

  document.getElementById(
    "couponDiscount"
  ).value = "";


  renderCoupons();

  updateStats();

}


function renderCoupons(){

  const box =
    document.getElementById(
      "couponList"
    );

  const coupons =
    getCoupons();


  if(!coupons.length){

    box.innerHTML =
      '<div class="empty">No coupons added.</div>';

    return;

  }


  box.innerHTML =
    coupons.map(c => `

      <div class="coupon">

        <div>

          <strong>
            ${escapeHtml(c.code)}
          </strong>

          <br>

          <small>
            ${Number(c.discount)}% OFF
          </small>

        </div>

        <button
          class="small-btn btn-red"
          onclick="deleteCoupon('${c.id}')"
        >
          Delete
        </button>

      </div>

    `).join("");

}


function deleteCoupon(id){

  let coupons =
    getCoupons();


  coupons =
    coupons.filter(
      c =>
        String(c.id) !== String(id)
    );


  saveCoupons(coupons);

  renderCoupons();

  updateStats();

}


/* =====================================================
   ORDERS
===================================================== */

function getOrders(){

  try{

    return JSON.parse(
      localStorage.getItem(ORDER_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}


function renderOrders(){

  const box =
    document.getElementById(
      "orderList"
    );

  const orders =
    getOrders();


  if(!orders.length){

    box.innerHTML =
      '<div class="empty">No orders yet.</div>';

    return;

  }


  box.innerHTML =
    orders.map((o,i) => `

      <div class="order">

        <strong>
          Order #${i+1}
        </strong>

        <p>
          ${escapeHtml(
            o.name ||
            o.customerName ||
            "Customer"
          )}
        </p>

        <p>
          ₹${Number(
            o.total ||
            o.amount ||
            0
          )}
        </p>

        <small>
          ${escapeHtml(
