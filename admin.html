<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jibran's Creations — Admin</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,Arial;
background:#f7f4fb;
color:#29243b
}
.wrap{max-width:1100px;margin:auto;padding:20px}
.box{
background:#fff;
padding:22px;
border-radius:20px;
box-shadow:0 10px 30px #0001;
margin-bottom:18px
}
input,textarea,select{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:10px;
font:inherit
}
textarea{min-height:90px}
button{
border:0;
border-radius:10px;
padding:11px 16px;
font-weight:700;
cursor:pointer;
margin:4px
}
.primary{background:#29243b;color:white}
.pink{background:#e88bb6;color:white}
.red{background:#e5484d;color:white}
.gray{background:#eee}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px
}
.product{
border:1px solid #eee;
border-radius:16px;
padding:15px
}
.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px
}
.price{font-size:22px;font-weight:800}
.hidden{display:none}
.actions{display:flex;gap:5px}
</style>
</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div id="loginBox" class="box">

<h1>🔐 Jibran's Creations</h1>
<p>Authorized Admin Login</p>

<input id="email"
type="email"
placeholder="Admin Email">

<input id="password"
type="password"
placeholder="Admin Password">

<button class="primary" onclick="login()">
Secure Login
</button>

<p id="loginMsg"></p>

</div>


<!-- ADMIN -->
<div id="adminPanel" class="hidden">

<div class="box">

<h1>🛠️ Admin Panel</h1>

<p>Welcome to Jibran's Creations.</p>

<button class="red" onclick="logout()">
Logout
</button>

</div>


<!-- PRODUCTS -->

<div class="box">

<h2>📦 Products</h2>

<input id="name"
placeholder="Product Name">

<input id="mrp"
type="number"
placeholder="MRP ₹">

<input id="price"
type="number"
placeholder="Selling Price ₹">

<input id="stock"
type="number"
placeholder="Stock">

<select id="category">
<option value="">Category</option>
<option>DIY Kit</option>
<option>Painting</option>
<option>Craft</option>
<option>Kids</option>
<option>Other</option>
</select>

<input id="image"
placeholder="Product Image URL">

<textarea id="description"
placeholder="Product Description"></textarea>

<button class="pink"
onclick="addProduct()">
➕ Add Product
</button>

<button class="gray"
onclick="clearForm()">
Clear
</button>

<p id="productMsg"></p>

</div>


<!-- PRODUCT LIST -->

<div class="box">

<h2>🛍️ Your Products</h2>

<div id="products"
class="grid"></div>

</div>


<!-- COUPONS -->

<div class="box">

<h2>🎟️ Coupons / Redeem</h2>

<input id="couponCode"
placeholder="Coupon Code">

<select id="couponType">
<option value="percent">Percentage %</option>
<option value="fixed">Fixed ₹</option>
</select>

<input id="couponValue"
type="number"
placeholder="Discount Value">

<button class="pink"
onclick="addCoupon()">
➕ Add Coupon
</button>

<div id="coupons"></div>

</div>


<!-- REVIEWS -->

<div class="box">

<h2>⭐ Customer Reviews</h2>

<div id="reviews">
<p>No reviews yet.</p>
</div>

</div>

</div>

</div>


<script>

/* =========================
   ADMIN LOGIN
========================= */

const ADMIN_EMAIL =
"jibran.shahban@gmail.com";

const ADMIN_PASSWORD =
"AnasAdmin@2026";


function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(
email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
&&
password === ADMIN_PASSWORD
){

sessionStorage.setItem(
"JC_ADMIN",
"true"
);

openAdmin();

}else{

document.getElementById("loginMsg").textContent =
"❌ Wrong email or password.";

}

}


function openAdmin(){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("adminPanel")
.classList.remove("hidden");

loadProducts();
loadCoupons();
loadReviews();

}


function logout(){

sessionStorage.removeItem("JC_ADMIN");

location.reload();

}


/* =========================
   PRODUCTS
========================= */

function getProducts(){

return JSON.parse(
localStorage.getItem("JC_PRODUCTS") || "[]"
);

}


function saveProducts(data){

localStorage.setItem(
"JC_PRODUCTS",
JSON.stringify(data)
);

}


function addProduct(){

const product={

id:Date.now(),

name:
document.getElementById("name").value.trim(),

mrp:
Number(document.getElementById("mrp").value),

price:
Number(document.getElementById("price").value),

stock:
Number(document.getElementById("stock").value),

category:
document.getElementById("category").value,

image:
document.getElementById("image").value.trim(),

description:
document.getElementById("description").value.trim()

};


if(!product.name || !product.price){

alert("Product name और price डालना जरूरी है.");

return;

}


const products=getProducts();

products.push(product);

saveProducts(products);

clearForm();

loadProducts();

document.getElementById("productMsg").textContent =
"✅ Product added successfully.";

}


function loadProducts(){

const products=getProducts();

const box=
document.getElementById("products");

if(!products.length){

box.innerHTML="<p>No products added yet.</p>";

return;

}


box.innerHTML=products.map(p=>`

<div class="product">

<img src="${escapeHTML(p.image || '')}"
onerror="this.style.display='none'">

<h3>${escapeHTML(p.name)}</h3>

<p>${escapeHTML(p.description || '')}</p>

<p>
MRP:
<del>₹${p.mrp || p.price}</del>
</p>

<div class="price">
₹${p.price}
</div>

<p>
📦 Stock: ${p.stock}
</p>

<p>
🏷️ ${escapeHTML(p.category || 'Other')}
</p>

<div class="actions">

<button class="red"
onclick="deleteProduct(${p.id})">
Delete
</button>

</div>

</div>

`).join("");

}


function deleteProduct(id){

if(!confirm("Delete this product?")) return;

const products=
getProducts().filter(p=>p.id!==id);

saveProducts(products);

loadProducts();

}


function clearForm(){

document.getElementById("name").value="";
document.getElementById("mrp").value="";
document.getElementById("price").value="";
document.getElementById("stock").value="";
document.getElementById("category").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";

}


/* =========================
   COUPONS
========================= */

function getCoupons(){

return JSON.parse(
localStorage.getItem("JC_COUPONS") || "[]"
);

}


function addCoupon(){

const code=
document.getElementById("couponCode")
.value.trim().toUpperCase();

const type=
document.getElementById("couponType").value;

const value=
Number(document.getElementById("couponValue").value);

if(!code || !value){

alert("Coupon code और discount डालो.");

return;

}

const coupons=getCoupons();

coupons.push({
id:Date.now(),
code,
type,
value
});

localStorage.setItem(
"JC_COUPONS",
JSON.stringify(coupons)
);

document.getElementById("couponCode").value="";
document.getElementById("couponValue").value="";

loadCoupons();

}


function loadCoupons(){

const coupons=getCoupons();

const box=
document.getElementById("coupons");

if(!coupons.length){

box.innerHTML="<p>No coupons.</p>";

return;

}

box.innerHTML=coupons.map(c=>`

<div style="
padding:10px;
margin:8px 0;
background:#f7f4fb;
border-radius:10px">

<b>${escapeHTML(c.code)}</b>

—
${c.type==="percent"
?c.value+"% OFF"
:"₹"+c.value+" OFF"}

<button class="red"
onclick="deleteCoupon(${c.id})">
Delete
</button>

</div>

`).join("");

}


function deleteCoupon(id){

const coupons=
getCoupons().filter(c=>c.id!==id);

localStorage.setItem(
"JC_COUPONS",
JSON.stringify(coupons)
);

loadCoupons();

}


/* =========================
   REVIEWS
========================= */

function loadReviews(){

const reviews=
JSON.parse(
localStorage.getItem("JC_REVIEWS") || "[]"
);

const box=
document.getElementById("reviews");

if(!reviews.length){

box.innerHTML="<p>No reviews yet.</p>";

return;

}

box.innerHTML=reviews.map(r=>`

<div style="
padding:12px;
margin:8px 0;
border:1px solid #eee;
border-radius:12px">

<strong>
${escapeHTML(r.name)}
</strong>

<div>
${"⭐".repeat(Number(r.rating || 5))}
</div>

<p>
${escapeHTML(r.text)}
</p>

<button class="red"
onclick="deleteReview(${r.id})">
Delete
</button>

</div>

`).join("");

}


function deleteReview(id){

const reviews=
JSON.parse(
localStorage.getItem("JC_REVIEWS") || "[]"
).filter(r=>r.id!==id);

localStorage.setItem(
"JC_REVIEWS",
JSON.stringify(reviews)
);

loadReviews();

}


/* =========================
   SECURITY DISPLAY HELPER
========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* AUTO LOGIN */

if(
sessionStorage.getItem("JC_ADMIN")==="true"
){

openAdmin();

}

</script>

</body>
</html>
